<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영상 배속 조절</title><link rel="stylesheet" href="popup.css"></head>
<body><main><p class="eyebrow">VIDEO SPEED CONTROL</p><h1>편한 속도로 들으세요</h1><p class="intro">선택한 배속을 다음 강의에도 적용합니다.</p>
<label class="toggle"><span>배속 유지</span><input id="enabled" type="checkbox" role="switch"></label>
<label class="speed" for="rate">재생 속도<select id="rate"></select></label>
<p id="status" role="status" aria-live="polite"></p><p class="note">설치 후 열려 있는 강의 창을 새로고침해 주세요. 고배속에서는 영상 안의 실측 표시를 확인해 주세요.</p>
</main><script src="settings.js"></script><script src="popup.js"></script></body></html>
